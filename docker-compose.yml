# CT Sale — production uchun Docker Compose.
#
# Ishga tushirish: DEPLOYMENT.md, "A. Docker Compose" bo'limi.
# Sirlar backend/.env dan o'qiladi — bu faylga yozilmaydi.

name: ctsale

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ctsale}
      POSTGRES_USER: ${POSTGRES_USER:-ctsale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}
      # Uzbek matnlar to'g'ri saralanishi uchun
      LANG: C.UTF-8
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ctsale} -d ${POSTGRES_DB:-ctsale}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Tashqariga ochilmaydi — faqat ichki tarmoq
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    expose:
      - "6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER:-ctsale}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ctsale}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - media:/app/media
      - static:/app/staticfiles
      - logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    expose:
      - "8000"

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=2 --max-tasks-per-child=100
    env_file: ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER:-ctsale}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ctsale}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - media:/app/media
      - logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A config beat --loglevel=info --schedule=/app/logs/celerybeat-schedule
    env_file: ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER:-ctsale}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ctsale}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5173"
      API_URL: http://backend:8000
    depends_on:
      - backend
    expose:
      - "5173"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/var/www/media:ro
      - static:/var/www/static:ro
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  redisdata:
  media:
  static:
  logs:
  certbot-webroot:
  certbot-certs:
