# CT Sale — Nginx
#
# Domenni o'zgartiring: domain.uz -> o'zingizniki
# SSL sozlamalarini certbot o'zi qo'shadi (`certbot --nginx`).

upstream ctsale_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream ctsale_frontend {
    server 127.0.0.1:5173;
    keepalive 16;
}

# Yuklash chegaralari: bir IP soniyasiga 10 ta so'rov, portlash 20 ta
limit_req_zone $binary_remote_addr zone=ctsale_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name domain.uz www.domain.uz;

    # Certbot HTTP-01 tekshiruvi
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name domain.uz www.domain.uz;

    # ssl_certificate / ssl_certificate_key — certbot qo'shadi

    # Video 50 MB gacha; zaxira bilan 60 MB
    client_max_body_size 60M;
    client_body_timeout 120s;

    # Siqish
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml application/json
        application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    access_log /var/log/nginx/ctsale.access.log;
    error_log  /var/log/nginx/ctsale.error.log;

    # ---- API ----
    location /api/ {
        limit_req zone=ctsale_api burst=20 nodelay;

        proxy_pass http://ctsale_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Ko'rish hisoblagichi haqiqiy IP ni ko'rishi uchun majburiy
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---- Django admin (ixtiyoriy: IP bo'yicha cheklash) ----
    location /django-admin/ {
        # allow 203.0.113.0/24;
        # deny all;

        proxy_pass http://ctsale_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- SEO fayllari (backend dinamik generatsiya qiladi) ----
    location = /robots.txt {
        proxy_pass http://ctsale_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/sitemap.*\.xml$ {
        proxy_pass http://ctsale_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Media (foydalanuvchi yuklagan fayllar) ----
    location /media/ {
        alias /opt/ctsale/app/backend/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Yuklangan fayl hech qachon skript sifatida bajarilmasin
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "inline" always;
        access_log off;
    }

    # ---- Django statik fayllari ----
    location /static/ {
        alias /opt/ctsale/app/backend/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- Frontend statik chunklari (hashlangan nomlar) ----
    location /assets/ {
        proxy_pass http://ctsale_frontend;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- SSR sahifalar ----
    location / {
        proxy_pass http://ctsale_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # HTML hech qachon keshlanmaydi — SSR har safar yangi
        add_header Cache-Control "no-cache" always;
    }
}
