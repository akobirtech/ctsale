# CT Sale — Nginx (Docker Compose uchun).
#
# Farqi: upstream'lar `localhost` emas, konteyner nomlari bo'yicha
# topiladi; statik fayllar esa umumiy volume'lardan beriladi.
#
# SSL yo'qligida ham ishlaydi (80-port). Sertifikat olish uchun:
#   docker compose run --rm certbot certonly --webroot \
#     -w /var/www/certbot -d domain.uz
# so'ng pastdagi 443 blokini yoqing.

upstream ctsale_backend {
    server backend:8000;
    keepalive 16;
}

upstream ctsale_frontend {
    server frontend:5173;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=ctsale_api:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # Certbot HTTP-01 tekshiruvi
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # SSL o'rnatilgandan keyin quyidagi qatorni yoqing:
    # location / { return 301 https://$host$request_uri; }

    client_max_body_size 60M;
    client_body_timeout 120s;

    # Server versiyasini oshkor qilmaslik. Django middleware buni
    # qila olmaydi — headerni HTTP server middleware'dan keyin
    # qo'yadi, shuning uchun to'siq shu yerda.
    server_tokens off;
    proxy_hide_header Server;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml application/json
        application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    location /api/ {
        limit_req zone=ctsale_api burst=20 nodelay;

        proxy_pass http://ctsale_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Ko'rish hisoblagichi haqiqiy IP ni ko'rishi uchun majburiy
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /django-admin/ {
        proxy_pass http://ctsale_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://ctsale_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/sitemap.*\.xml$ {
        proxy_pass http://ctsale_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Yuklangan fayl hech qachon skript sifatida bajarilmasin
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "inline" always;
        access_log off;
    }

    location /static/ {
        alias /var/www/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /assets/ {
        proxy_pass http://ctsale_frontend;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://ctsale_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # HTML hech qachon keshlanmaydi — SSR har safar yangi
        add_header Cache-Control "no-cache" always;
    }
}
